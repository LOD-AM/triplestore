name: test

# Starts the real Fuseki container with this repo's config, loads the
# knowledge-graph data and runs the smoke test (health, public query,
# write protection).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuseki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LOD-AM/knowledge-graph
          path: knowledge-graph

      - name: Config files are valid
        run: |
          cp .env.example .env
          sed -i 's/^FUSEKI_ADMIN_PASSWORD=.*/FUSEKI_ADMIN_PASSWORD=ci-test-password/' .env
          docker compose config -q
          pip install --quiet rdflib
          python3 -c "import rdflib; rdflib.Graph().parse('fuseki-config/assembler.ttl')"

      - name: A missing fuseki-data is refused (no root-owned folder)
        run: |
          test ! -e fuseki-data
          if docker compose create fuseki; then
            echo "FAIL: compose created the container without fuseki-data"; exit 1
          fi
          test ! -e fuseki-data && echo "ok: refused, and no folder was created"

      - name: Start Fuseki
        run: |
          mkdir -p fuseki-data
          sudo chown -R 9008:9008 fuseki-data fuseki-config
          docker compose up -d fuseki
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' lod-am-fuseki)" = healthy ] && break
            sleep 3
          done
          docker inspect -f 'health: {{.State.Health.Status}}' lod-am-fuseki
          docker logs lod-am-fuseki 2>&1 | tail -20

      - name: Load knowledge-graph data
        run: scripts/load.sh --replace knowledge-graph/data knowledge-graph/examples

      - name: Smoke test
        run: scripts/smoke_test.sh --min-triples 100

      # planning#31: --replace leaves deleted labels in the text index;
      # scripts/reindex.sh must remove them.
      - name: Text index is rebuilt by reindex.sh
        run: |
          hits() { curl -s -G -H 'Accept: text/csv' --data-urlencode \
            "query=PREFIX text: <http://jena.apache.org/text#> SELECT (COUNT(*) AS ?n) WHERE { (?s ?sc ?l) text:query (\"$1\") }" \
            http://localhost:3030/LOD-AM/sparql | tail -n 1 | tr -d '\r'; }
          printf '<urn:x:stale> <http://www.w3.org/2000/01/rdf-schema#label> "Zzstalelabel"@en .\n' > /tmp/stale.ttl
          scripts/load.sh /tmp/stale.ttl
          test "$(hits zzstalelabel)" = 1 && echo "ok: new label indexed on load"
          scripts/load.sh --replace knowledge-graph/data knowledge-graph/examples
          echo "stale hits after --replace: $(hits zzstalelabel)"
          scripts/reindex.sh
          test "$(hits zzstalelabel)" = 0 && echo "ok: stale label gone after reindex"
          test "$(hits 'spear*')" -ge 1 && echo "ok: knowledge-graph labels found after reindex"
          scripts/smoke_test.sh --min-triples 100

      # planning#30: 10 s to the first result. A cross join over all triples
      # takes far longer, so it must be cut off with 503 after about 10 s.
      - name: A slow query is stopped by the timeout
        run: |
          start=$(date +%s)
          code=$(curl -s -o /tmp/slow.txt -w '%{http_code}' --max-time 90 -G -H 'Accept: text/csv' \
            --data-urlencode 'query=SELECT (COUNT(*) AS ?n) WHERE { ?a ?b ?c . ?d ?e ?f . ?g ?h ?i }' \
            http://localhost:3030/LOD-AM/sparql || true)
          took=$(( $(date +%s) - start ))
          echo "http $code after ${took}s: $(head -c 100 /tmp/slow.txt)"
          test "$code" = 503 && test "$took" -ge 9 && test "$took" -le 30

      - name: Fuseki log on failure
        if: failure()
        run: docker logs lod-am-fuseki
