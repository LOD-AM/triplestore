name: test

# Starts the real Fuseki container with this repo's config, loads the
# knowledge-graph data and runs the smoke test (health, public query,
# write protection), the named-graph migration, the release update and the webhook.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuseki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LOD-AM/knowledge-graph
          path: knowledge-graph

      - name: Config files are valid
        run: |
          cp .env.example .env
          sed -i 's/^FUSEKI_ADMIN_PASSWORD=.*/FUSEKI_ADMIN_PASSWORD=ci-test-password/' .env
          docker compose config -q
          pip install --quiet rdflib
          python3 -c "import rdflib; rdflib.Graph().parse('fuseki-config/assembler.ttl')"

      - name: A missing fuseki-data is refused (no root-owned folder)
        run: |
          test ! -e fuseki-data
          if docker compose create fuseki; then
            echo "FAIL: compose created the container without fuseki-data"; exit 1
          fi
          test ! -e fuseki-data && echo "ok: refused, and no folder was created"

      - name: Start Fuseki
        run: |
          mkdir -p fuseki-data
          sudo chown -R 9008:9008 fuseki-data
          # fuseki-config stays the checkout user's; Fuseki writes via group 9008
          sudo chgrp 9008 fuseki-config && sudo chmod 2775 fuseki-config
          docker compose up -d fuseki
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' lod-am-fuseki)" = healthy ] && break
            sleep 3
          done
          docker inspect -f 'health: {{.State.Health.Status}}' lod-am-fuseki
          docker logs lod-am-fuseki 2>&1 | tail -20

      - name: Load knowledge-graph data
        run: scripts/load.sh --replace knowledge-graph/data knowledge-graph/examples

      - name: Smoke test
        run: scripts/smoke_test.sh --min-triples 100

      # As on the server: the checkout user (not root, not 9008) replaces the
      # config, as git pull does; reindex.sh below restarts Fuseki with it.
      - name: The checkout user can replace fuseki-config/assembler.ttl
        run: |
          cp fuseki-config/assembler.ttl /tmp/assembler.ttl
          rm fuseki-config/assembler.ttl
          cp /tmp/assembler.ttl fuseki-config/assembler.ttl
          ls -ln fuseki-config

      # planning#31: --replace leaves deleted labels in the text index;
      # scripts/reindex.sh must remove them.
      - name: Text index is rebuilt by reindex.sh
        run: |
          hits() { curl -s -G -H 'Accept: text/csv' --data-urlencode \
            "query=PREFIX text: <http://jena.apache.org/text#> SELECT (COUNT(*) AS ?n) WHERE { (?s ?sc ?l) text:query (\"$1\") }" \
            http://localhost:3030/LOD-AM/sparql | tail -n 1 | tr -d '\r'; }
          printf '<urn:x:stale> <http://www.w3.org/2000/01/rdf-schema#label> "Zzstalelabel"@en .\n' > /tmp/stale.ttl
          scripts/load.sh /tmp/stale.ttl
          test "$(hits zzstalelabel)" = 1 && echo "ok: new label indexed on load"
          scripts/load.sh --replace knowledge-graph/data knowledge-graph/examples
          echo "stale hits after --replace: $(hits zzstalelabel)"
          scripts/reindex.sh
          test "$(hits zzstalelabel)" = 0 && echo "ok: stale label gone after reindex"
          test "$(hits 'spear*')" -ge 1 && echo "ok: knowledge-graph labels found after reindex"
          scripts/smoke_test.sh --min-triples 100

      # planning#7: named graphs + union default graph. The migration (knowledge graph into its
      # named graph, stored default graph deleted) with the real reindex.sh
      - name: Migration to named graphs
        run: |
          scripts/migrate_named_graphs.sh knowledge-graph/data knowledge-graph/examples
          n=$(curl -s -G -H 'Accept: text/csv' --data-urlencode \
            'query=SELECT (COUNT(*) AS ?n) WHERE { GRAPH <https://lod-am.net/graph/knowledge-graph> { ?s ?p ?o } }' \
            http://localhost:3030/LOD-AM/sparql | tail -n 1 | tr -d '\r')
          test "$n" -ge 100 && echo "ok: knowledge graph in its named graph ($n triples)"

      # planning#7: pull, check, load and swap a release, with riot from the Fuseki image and the
      # real reindex.sh; fake releases built from a public knowledge-graph file (no blank nodes)
      - name: Release update (update_published.sh)
        run: LODAM_TEST=1 scripts/test_update_published.sh knowledge-graph/data/vocab/topics.ttl

      # planning#35: knowledge-graph main (data/ only) into its graph, gated by its checks; a local
      # stand-in repository replaces GitHub
      - name: Knowledge-graph update (update_kg.sh)
        run: LODAM_TEST=1 scripts/test_update_kg.sh knowledge-graph

      - name: Webhook receiver
        run: bash deploy/test_webhook.sh

      # planning#34: the failure mail (curl, systemctl and journalctl stubbed)
      - name: Alert mail
        run: bash deploy/test_alert.sh

      # website#21: the live release goes to the website's branch data-release (local stand-in repo)
      - name: Hand-over to the website (publish_website.sh)
        run: bash scripts/test_publish_website.sh

      - name: Shell scripts (shellcheck, preinstalled on ubuntu-latest)
        run: shellcheck -S warning scripts/*.sh deploy/*.sh

      # planning#30: 10 s to the first result. A cross join over all triples
      # takes far longer, so it must be cut off with 503 after about 10 s.
      - name: A slow query is stopped by the timeout
        run: |
          start=$(date +%s)
          code=$(curl -s -o /tmp/slow.txt -w '%{http_code}' --max-time 90 -G -H 'Accept: text/csv' \
            --data-urlencode 'query=SELECT (COUNT(*) AS ?n) WHERE { ?a ?b ?c . ?d ?e ?f . ?g ?h ?i }' \
            http://localhost:3030/LOD-AM/sparql || true)
          took=$(( $(date +%s) - start ))
          echo "http $code after ${took}s: $(head -c 100 /tmp/slow.txt)"
          test "$code" = 503 && test "$took" -ge 9 && test "$took" -le 30

      - name: Fuseki log on failure
        if: failure()
        run: docker logs lod-am-fuseki
