# Access control for Fuseki (Apache Shiro). Versioned; contains NO secret:
# the admin password is set from FUSEKI_ADMIN_PASSWORD at container start
# (the image's entrypoint rewrites the line starting with "admin=" below;
# keep it exactly in that form, without spaces around "=").
#
# Policy: SPARQL query is public; everything that can change data, and the
# admin UI/API, needs the admin login (HTTP basic auth).
# Shiro uses the FIRST matching rule, so order matters.

[main]
ssl.enabled = false
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin=placeholder-replaced-at-start

[roles]

[urls]
# Health checks
/$/status = anon
/$/ping   = anon
# Admin UI/API (dataset management, backups, ...)
/$/**     = authcBasic,user[admin]

# Public, read-only query endpoints
/LOD-AM/sparql = anon
/LOD-AM/query  = anon

# Everything else on the dataset: Graph Store (read-write) at /LOD-AM/data and
# operations on the dataset URL itself (which also accepts writes)
/LOD-AM      = authcBasic,user[admin]
/LOD-AM/**   = authcBasic,user[admin]

# Static files of the web UI
/** = anon
